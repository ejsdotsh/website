name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.25.1
      HUGO_VERSION: "latest"
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build the site
        run: |
          npm install
          hugo mod get -u ./...
          hugo \
            --gc \
            --minify

      - name: Rsync deployment
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avzr --delete --omit-dir-times
          path: public/
          remote_path: ${{ secrets.CONTENT_DESTINATION }}
          remote_host: ${{ secrets.SSH_HOSTNAME }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
